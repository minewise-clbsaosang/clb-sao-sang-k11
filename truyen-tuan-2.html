<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Truyện Voi Con Và Sóc Nhỏ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
  :root{--night:#1C2759;--night2:#111836;--gold:#FFC93C;--gold-d:#E08A00;--cream:#FFF8E8;--ink:#2E2618;--soft:#7A6648;--teal:#22B8A6;--teal-t:#DFF7F2;--pink:#FF8FB1;--indigo:#4A4FA0;}
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 500px at 80% 0%,rgba(255,201,60,.18),transparent 70%),linear-gradient(180deg,var(--night),var(--night2));background-attachment:fixed;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px));}
  .t{font-family:'Nunito',sans-serif;font-weight:800}
  .b{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800}
  .wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
  header{display:flex;align-items:center;gap:12px;color:#FFF6E0;}
  header img{height:44px;}
  header h1{font-family:'Baloo 2',sans-serif;font-size:clamp(18px,3.4vw,28px);margin:0;line-height:1.1;color:var(--gold);}
  header .sub{font-size:13px;font-weight:800;color:#C9CDF0;letter-spacing:.5px;}
  header .sp{flex:1}
  .icon-btn{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:20px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .stage{perspective:1800px;}
  .page{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;background:#FFF4DC;box-shadow:0 18px 40px rgba(0,0,0,.45);transform-origin:left center;}
  .page svg{width:100%;height:100%;display:block;}
  .page.out-next{animation:outNext .32s ease-in forwards;}
  .page.in-next{animation:inNext .32s ease-out;}
  .page.out-prev{animation:outPrev .32s ease-in forwards;transform-origin:right center;}
  .page.in-prev{animation:inPrev .32s ease-out;transform-origin:right center;}
  @keyframes outNext{to{transform:rotateY(-80deg);opacity:.4}}
  @keyframes inNext{from{transform:rotateY(70deg);opacity:.4}to{transform:none;opacity:1}}
  @keyframes outPrev{to{transform:rotateY(80deg);opacity:.4}}
  @keyframes inPrev{from{transform:rotateY(-70deg);opacity:.4}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion: reduce){.page.out-next,.page.in-next,.page.out-prev,.page.in-prev{animation:none}}
  .cap{background:var(--cream);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start;min-height:72px;}
  .cap .lines{flex:1;display:flex;flex-direction:column;gap:6px;font-size:clamp(15px,2.2vw,20px);line-height:1.4;font-weight:700;}
  .who{font-weight:900;color:var(--gold-d);}
  .ln-narr{color:#3E3226;font-weight:700;}
  .ln-ask{background:#DFF7F2;border-left:6px solid var(--teal);border-radius:12px;padding:6px 12px;color:#0F6E63;font-weight:800;}
  .reveal{align-self:flex-start;margin-top:4px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(15px,1.5vw,19px);border:3px dashed var(--teal);background:#fff;color:#0F6E63;border-radius:14px;padding:8px 14px;cursor:pointer;}
  .reveal:hover{background:var(--teal-t);}
  .ln-chant{background:#FFF0B3;border-left:6px solid var(--gold);border-radius:12px;padding:6px 12px;color:#7A4E00;font-weight:900;}
  .say{flex-shrink:0;width:48px;height:48px;border-radius:50%;border:3px solid var(--teal);background:var(--teal-t);font-size:22px;cursor:pointer;}
  .no-tts .say{display:none!important;}
  nav{display:flex;align-items:center;gap:10px;position:sticky;bottom:0;z-index:5;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(17,24,54,0),#111836 35%);}
  .nav-btn{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(16px,2.6vw,22px);border:none;border-radius:999px;padding:12px 20px;cursor:pointer;background:var(--gold);color:var(--night2);box-shadow:0 4px 0 var(--gold-d);}
  .nav-btn:active{transform:translateY(3px);box-shadow:none;}
  .nav-btn[disabled]{opacity:.35;cursor:default;}
  .nav-btn.prev{background:#FFF6E0;box-shadow:0 4px 0 #C9B88F;}
  .prog{flex:1;display:flex;flex-direction:column;gap:6px;align-items:center;}
  .bar{width:100%;height:10px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#FF9F43);width:0;transition:width .3s;}
  .num{color:#C9CDF0;font-weight:800;font-size:13px;}
  button:focus-visible{outline:3px solid #fff;outline-offset:2px;}


  /* trang trò chơi (HTML) */
  .game{position:absolute;inset:0;display:flex;flex-direction:column;padding:3.2% 4%;gap:2.4%;background:linear-gradient(180deg,#FFF8E8,#FFEFD0);}
  .page.is-game{aspect-ratio:auto;}
  .page.is-game .game{position:relative;inset:auto;min-height:calc(min(1100px,100vw - 32px) * 9 / 16);gap:14px;padding:18px;}
  @media (max-width:600px){.page.is-game .opts{grid-template-columns:1fr;} .page.is-game .opt{flex-direction:row;justify-content:flex-start;padding:10px 14px;gap:12px;font-size:18px;} .page.is-game .opt svg,.page.is-game .opt img{width:64px;max-height:64px;} .page.is-game .opt .emo{font-size:36px;} .page.is-game .order .opt{flex-direction:column;} .page.is-game .order .opt svg{width:100%;max-height:none;} .page.is-game .two{grid-template-columns:1fr 1fr;} .page.is-game .two .opt{flex-direction:column;justify-content:center;} .page.is-game .end-powers .opt{flex-direction:column;justify-content:center;font-size:14px;padding:8px;}}
  .game h2{margin:0;font-family:'Baloo 2',sans-serif;font-size:clamp(18px,3.4vw,40px);color:var(--indigo);display:flex;align-items:center;gap:12px;line-height:1.1;}
  .game h2 img{width:clamp(36px,6vw,70px);height:clamp(36px,6vw,70px);border-radius:50%;object-fit:cover;border:3px solid var(--teal);background:#fff;}
  .game .q{font-family:'Baloo 2',sans-serif;font-size:clamp(17px,3vw,36px);text-align:center;background:#fff;border:3px solid var(--gold);border-radius:20px;padding:1.2% 2%;}
  .opts{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:3%;align-items:stretch;}
  .opt{border:4px solid #F5DFA6;background:#fff;border-radius:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;padding:3%;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(13px,2.3vw,28px);color:var(--ink);transition:transform .15s,opacity .2s,border-color .2s;}
  .opt svg,.opt img{width:70%;height:auto;max-height:62%;}
  .opt img{border-radius:50%;}
  .opt:hover{transform:translateY(-3px);}
  .opt.ok{border-color:#2FBF71;background:#E6F9EE;}
  .opt.no{opacity:.35;}
  .opt .emo{font-size:clamp(28px,6vw,72px);line-height:1;}
  .fb{text-align:center;font-weight:900;font-size:clamp(14px,2.4vw,26px);min-height:1.4em;color:#13897B;}
  .fb.try{color:#B4540A;}
  .shake{animation:shake .35s;}
  @keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .order{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:2%;}
  .order .opt{padding:1.5%;position:relative;}
  .order .opt svg{width:100%;max-height:none;border-radius:12px;}
  .order .badge{position:absolute;top:-10px;left:-10px;width:clamp(28px,4vw,50px);height:clamp(28px,4vw,50px);border-radius:50%;background:var(--gold);color:var(--night2);display:none;align-items:center;justify-content:center;font-size:clamp(16px,2.6vw,30px);border:3px solid #fff;}
  .order .opt.ok .badge{display:flex;}
  .two{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3%;}
  .two .opt{font-size:clamp(14px,2.6vw,32px);}
  .card-q{font-family:'Baloo 2',sans-serif;font-size:clamp(16px,3vw,36px);text-align:center;background:#fff;border:4px dashed var(--teal);border-radius:20px;padding:2%;}
  .end-powers{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);gap:2%;}
  @media (max-width:600px){.end-powers{grid-template-columns:repeat(3,1fr);} .order{grid-template-columns:repeat(2,1fr);} .opt svg{max-height:50%;}}

  /* ===== Màn hình ngang (laptop, máy tính bảng ngang): vừa khít 1 màn hình, không cuộn ===== */
  @media (min-width:700px) and (orientation:landscape){
    html,body{height:100%;overflow:hidden;}
    body{padding:10px 20px 8px;}
    .wrap{height:100%;max-width:none;display:grid;grid-template-columns:minmax(0,1fr) clamp(280px,27vw,420px);grid-template-rows:auto minmax(0,1fr) auto;gap:10px 14px;}
    header{grid-column:1 / -1;}
    nav{grid-column:1 / -1;}
    header img{height:36px;}
    header h1{font-size:22px;}
    .stage{grid-column:1;grid-row:2;min-height:0;min-width:0;container-type:size;display:flex;align-items:center;justify-content:center;}
    .page,.page.is-game{width:min(100cqw, 100cqh * 16 / 9);aspect-ratio:16/9;height:auto;container-type:inline-size;}
    .page.is-game .game{position:absolute;inset:0;min-height:0;padding:2.6% 3.4%;gap:2%;}
    .cap{grid-column:2;grid-row:2;align-self:center;max-height:100%;height:auto;overflow:auto;padding:14px 16px;min-height:0;flex-direction:column;}
    .cap .say{align-self:flex-end;order:2;}
    .cap .lines{font-size:clamp(15px,1.45vw,20px);gap:8px;}
    nav{position:static;background:none;padding:2px 0 0;}
    .nav-btn{font-size:18px;padding:9px 18px;}
    .game h2{font-size:3.3cqw;} .game h2 img{width:5.5cqw;height:5.5cqw;}
    .game .q,.card-q{font-size:2.8cqw;}
    .opt{font-size:2.2cqw;min-height:0;} .opts,.two,.order,.end-powers{min-height:0;} .opt svg,.opt img{max-height:52%;} .opt .emo{font-size:5.2cqw;} .two .opt{font-size:2.6cqw;}
    .fb{font-size:2.2cqw;}
    .order .badge{width:4cqw;height:4cqw;font-size:2.4cqw;}
    .end-powers .opt{font-size:1.9cqw;}
    .stone-box{height:22cqw !important;max-height:30%;}
  }
</style></head>
<body>
<div class="wrap">
  <header>
    <img src="assets/minewise-logo.png" alt="Minewise">
    <div><h1>Voi Con và Sóc Nhỏ xây cầu</h1><div class="sub">CLB SAO SÁNG · TUẦN 2 · SỨC MẠNH BÊN TRONG CON</div></div>
    <span class="sp"></span>
    <button class="icon-btn" id="mute" type="button" aria-label="Bật/tắt âm thanh">🔔</button>
  </header>
  <div class="stage"><div class="page" id="page"></div></div>
  <div class="cap" id="cap"><div class="lines" id="lines"></div><button class="say" id="say" type="button" aria-label="Nghe đọc">🔊</button></div>
  <nav>
    <button class="nav-btn prev" id="prev" type="button">◀ Trước</button>
    <div class="prog"><div class="bar"><i id="bar"></i></div><div class="num" id="num"></div></div>
    <button class="nav-btn" id="next" type="button">Lật trang ▶</button>
  </nav>
</div>
<script>window.TT_ASSET = "assets/";</script>
<script>
/* Thư viện vẽ truyện tranh CLB Sao Sáng (5 nhân vật cố định). Ngôi Sao Sáng và Tắc Kè Hoa dùng ẢNH THẬT trong assets/. */
/* ================= bảng màu ================= */
var C = {
  ink:"#3A2A20", skin:"#F7C9A3", skinD:"#E9AE84", hair:"#3B2A20", binShirt:"#3FB8AF", binShorts:"#4A6FD0",
  star:"#FFC93C", starD:"#F2A900", tkh:"#FF9F43", tkhD:"#E07A1F", tkhL:"#FFD199",
  voi:"#9DB4D6", voiD:"#7E98C0", voiL:"#C9D8EE", soc:"#D9894A", socD:"#B86A2E", socL:"#F3C99A",
  rock:"#A39C8F", rockD:"#7C766B", water:"#7CC8E8", waterD:"#4FAFD8", grass:"#8CCB6B", grassD:"#6CB04E",
  wall:"#FDEBD3", floor:"#E8B98A", cheek:"#FF9AA2"
};

/* ================= khuôn mặt dùng chung ================= */
function face(expr, r, opt){
  opt = opt || {};
  var ex = r*0.36, ey = -r*0.08, s = "";
  var eye = function(x){ return '<ellipse cx="'+x+'" cy="'+ey+'" rx="'+(r*0.085)+'" ry="'+(r*0.11)+'" fill="'+C.ink+'"/><circle cx="'+(x+r*0.03)+'" cy="'+(ey-r*0.04)+'" r="'+(r*0.03)+'" fill="#fff"/>'; };
  var closed = function(x, up){ return '<path d="M'+(x-r*0.12)+' '+ey+' Q'+x+' '+(ey+(up?-1:1)*r*0.13)+' '+(x+r*0.12)+' '+ey+'" stroke="'+C.ink+'" stroke-width="'+(r*0.06)+'" fill="none" stroke-linecap="round"/>'; };
  var cheeks = '<circle cx="'+(-r*0.55)+'" cy="'+(r*0.18)+'" r="'+(r*0.13)+'" fill="'+C.cheek+'" opacity=".55"/><circle cx="'+(r*0.55)+'" cy="'+(r*0.18)+'" r="'+(r*0.13)+'" fill="'+C.cheek+'" opacity=".55"/>';
  var sw = r*0.055;
  switch(expr){
    case "happy":
      s = closed(-ex,true)+closed(ex,true)+'<path d="M'+(-r*0.28)+' '+(r*0.18)+' Q0 '+(r*0.62)+' '+(r*0.28)+' '+(r*0.18)+' Z" fill="#8A2B2B"/><path d="M'+(-r*0.15)+' '+(r*0.38)+' Q0 '+(r*0.5)+' '+(r*0.15)+' '+(r*0.38)+'" fill="#FF7B8A"/>'; break;
    case "strain":
      s = '<path d="M'+(-ex-r*0.13)+' '+(ey-r*0.08)+' L'+(-ex+r*0.1)+' '+ey+' L'+(-ex-r*0.13)+' '+(ey+r*0.08)+'" stroke="'+C.ink+'" stroke-width="'+sw+'" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
          '<path d="M'+(ex+r*0.13)+' '+(ey-r*0.08)+' L'+(ex-r*0.1)+' '+ey+' L'+(ex+r*0.13)+' '+(ey+r*0.08)+'" stroke="'+C.ink+'" stroke-width="'+sw+'" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
          '<rect x="'+(-r*0.25)+'" y="'+(r*0.22)+'" width="'+(r*0.5)+'" height="'+(r*0.16)+'" rx="'+(r*0.06)+'" fill="#fff" stroke="'+C.ink+'" stroke-width="'+(sw*0.7)+'"/>'+
          '<path d="M'+(r*0.62)+' '+(-r*0.45)+' q'+(r*0.08)+' '+(r*0.16)+' 0 '+(r*0.2)+' q'+(-r*0.08)+' '+(-r*0.04)+' 0 '+(-r*0.2)+'" fill="#8FD3F4"/>'; cheeks = cheeks.replace(/opacity=".55"/g,'opacity=".9"'); break;
    case "surprised":
      s = '<circle cx="'+(-ex)+'" cy="'+ey+'" r="'+(r*0.13)+'" fill="#fff" stroke="'+C.ink+'" stroke-width="'+sw+'"/><circle cx="'+(-ex)+'" cy="'+ey+'" r="'+(r*0.06)+'" fill="'+C.ink+'"/>'+
          '<circle cx="'+ex+'" cy="'+ey+'" r="'+(r*0.13)+'" fill="#fff" stroke="'+C.ink+'" stroke-width="'+sw+'"/><circle cx="'+ex+'" cy="'+ey+'" r="'+(r*0.06)+'" fill="'+C.ink+'"/>'+
          '<ellipse cx="0" cy="'+(r*0.33)+'" rx="'+(r*0.12)+'" ry="'+(r*0.15)+'" fill="#8A2B2B"/>'; break;
    case "angry":
      s = eye(-ex)+eye(ex)+'<path d="M'+(-ex-r*0.16)+' '+(ey-r*0.26)+' L'+(-ex+r*0.12)+' '+(ey-r*0.14)+'" stroke="'+C.ink+'" stroke-width="'+(sw*1.2)+'" stroke-linecap="round"/><path d="M'+(ex+r*0.16)+' '+(ey-r*0.26)+' L'+(ex-r*0.12)+' '+(ey-r*0.14)+'" stroke="'+C.ink+'" stroke-width="'+(sw*1.2)+'" stroke-linecap="round"/>'+
          '<path d="M'+(-r*0.2)+' '+(r*0.4)+' Q0 '+(r*0.22)+' '+(r*0.2)+' '+(r*0.4)+'" stroke="'+C.ink+'" stroke-width="'+sw+'" fill="none" stroke-linecap="round"/>'; cheeks = cheeks.replace(/#FF9AA2/g,"#FF6B6B"); break;
    case "sad":
      s = eye(-ex)+eye(ex)+'<path d="M'+(-ex-r*0.14)+' '+(ey-r*0.16)+' L'+(-ex+r*0.12)+' '+(ey-r*0.27)+'" stroke="'+C.ink+'" stroke-width="'+sw+'" stroke-linecap="round"/><path d="M'+(ex+r*0.14)+' '+(ey-r*0.16)+' L'+(ex-r*0.12)+' '+(ey-r*0.27)+'" stroke="'+C.ink+'" stroke-width="'+sw+'" stroke-linecap="round"/>'+
          '<path d="M'+(-r*0.18)+' '+(r*0.4)+' Q0 '+(r*0.26)+' '+(r*0.18)+' '+(r*0.4)+'" stroke="'+C.ink+'" stroke-width="'+sw+'" fill="none" stroke-linecap="round"/>'; break;
    case "calm":
      s = closed(-ex,false)+closed(ex,false)+'<path d="M'+(-r*0.15)+' '+(r*0.3)+' Q0 '+(r*0.4)+' '+(r*0.15)+' '+(r*0.3)+'" stroke="'+C.ink+'" stroke-width="'+sw+'" fill="none" stroke-linecap="round"/>'; break;
    case "sorry":
      s = '<ellipse cx="'+(-ex)+'" cy="'+(ey+r*0.06)+'" rx="'+(r*0.08)+'" ry="'+(r*0.08)+'" fill="'+C.ink+'"/><ellipse cx="'+ex+'" cy="'+(ey+r*0.06)+'" rx="'+(r*0.08)+'" ry="'+(r*0.08)+'" fill="'+C.ink+'"/>'+
          '<path d="M'+(-ex-r*0.14)+' '+(ey-r*0.12)+' L'+(-ex+r*0.12)+' '+(ey-r*0.22)+'" stroke="'+C.ink+'" stroke-width="'+sw+'" stroke-linecap="round"/><path d="M'+(ex+r*0.14)+' '+(ey-r*0.12)+' L'+(ex-r*0.12)+' '+(ey-r*0.22)+'" stroke="'+C.ink+'" stroke-width="'+sw+'" stroke-linecap="round"/>'+
          '<path d="M'+(-r*0.18)+' '+(r*0.34)+' q'+(r*0.09)+' '+(-r*0.07)+' '+(r*0.18)+' 0 t'+(r*0.18)+' 0" stroke="'+C.ink+'" stroke-width="'+sw+'" fill="none" stroke-linecap="round"/>'; cheeks = cheeks.replace(/opacity=".55"/g,'opacity=".95"'); break;
    case "yawn":
      s = '<path d="M'+(-ex-r*0.12)+' '+ey+' L'+(-ex+r*0.12)+' '+ey+'" stroke="'+C.ink+'" stroke-width="'+sw+'" stroke-linecap="round"/><path d="M'+(ex-r*0.12)+' '+ey+' L'+(ex+r*0.12)+' '+ey+'" stroke="'+C.ink+'" stroke-width="'+sw+'" stroke-linecap="round"/>'+
          '<ellipse cx="0" cy="'+(r*0.35)+'" rx="'+(r*0.14)+'" ry="'+(r*0.2)+'" fill="#8A2B2B"/>'; break;
    case "talk":
      s = eye(-ex)+eye(ex)+'<path d="M'+(-r*0.2)+' '+(r*0.24)+' Q0 '+(r*0.5)+' '+(r*0.2)+' '+(r*0.24)+' Z" fill="#8A2B2B"/>'; break;
    default: // smile
      s = eye(-ex)+eye(ex)+'<path d="M'+(-r*0.24)+' '+(r*0.24)+' Q0 '+(r*0.48)+' '+(r*0.24)+' '+(r*0.24)+'" stroke="'+C.ink+'" stroke-width="'+sw+'" fill="none" stroke-linecap="round"/>';
  }
  return cheeks + s;
}
function g(x, y, sc, inner, flip){ return '<g transform="translate('+x+' '+y+') scale('+(flip?-sc:sc)+' '+sc+')">'+inner+'</g>'; }
function limb(x1,y1,x2,y2,col,w){ var mx=(x1+x2)/2+(y2-y1)*0.12, my=(y1+y2)/2-(x2-x1)*0.12; return '<path d="M'+x1+' '+y1+' Q'+mx+' '+my+' '+x2+' '+y2+'" stroke="'+col+'" stroke-width="'+w+'" fill="none" stroke-linecap="round"/>'; }

/* ================= Bin ================= */
function bin(x, y, sc, o){
  o = o || {}; var pose = o.pose || "down", ex = o.expr || "smile";
  var shirt = o.shirt || C.binShirt, shorts = o.shorts || C.binShorts;
  var H = {
    down:[[-105,-150],[105,-150]], jar:[[-38,-205],[38,-205]], jarup:[[-105,-150],[120,-470]], wave:[[-105,-150],[150,-430]],
    cookie:[[-105,-150],[125,-250]], brush:[[-105,-150],[42,-345]], talk:[[-130,-235],[130,-235]], sit:[[-70,-140],[70,-140]], open:[[-60,-205],[130,-300]]
  }[pose];
  var s = "";
  s += '<ellipse cx="0" cy="4" rx="95" ry="14" fill="#000" opacity=".12"/>';
  s += '<rect x="-48" y="-70" width="30" height="66" rx="12" fill="'+C.skin+'"/><rect x="18" y="-70" width="30" height="66" rx="12" fill="'+C.skin+'"/>';
  s += '<ellipse cx="-36" cy="-4" rx="30" ry="14" fill="#E2574C"/><ellipse cx="36" cy="-4" rx="30" ry="14" fill="#E2574C"/>';
  s += '<rect x="-72" y="-150" width="144" height="92" rx="26" fill="'+shorts+'"/>';
  s += limb(-78,-268,H[0][0],H[0][1],C.skin,34);

<script>
(function(){

var muted = false; try { muted = localStorage.getItem("tt_mute") === "1"; } catch(e){}

function tone(f, t0, d, type, vol){ if (muted) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); var o = actx.createOscillator(), g = actx.createGain(); o.type = type || "sine"; o.frequency.value = f; g.gain.setValueAtTime(0, actx.currentTime + t0); g.gain.linearRampToValueAtTime(vol || .18, actx.currentTime + t0 + .02); g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + t0 + d); o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + d + .05); } catch(e){} }
var SND = { flip: function(){ tone(520,0,.08,"triangle",.08); tone(780,.05,.08,"triangle",.06); },
  ok: function(){ tone(660,0,.15); tone(880,.12,.2); tone(1175,.26,.28); },

/* ---------- đọc to ---------- */

if (!ttsOK) document.documentElement.classList.add("no-tts"); else { pickVoice(); try { speechSynthesis.addEventListener("voiceschanged", pickVoice); } catch(e){ speechSynthesis.onvoiceschanged = pickVoice; } }
function speak(t){ if (!ttsOK || !t || muted) return; try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(t); u.lang = "vi-VN"; if (viVoice) u.voice = viVoice; u.rate = .92; speechSynthesis.speak(u); } catch(e){} }

/* ---------- hình nhỏ của nhân vật ---------- */

var segs = [], shown = 1, curKey = null;
function splitSegs(lines){
  var out = [[]];
  lines.forEach(function(l){ out[out.length - 1].push(l); if (l[0] === "hỏi" && !/^Gửi ba mẹ/.test(l[1])) out.push([]); });
  if (!out[out.length - 1].length) out.pop();

}
function hiddenLeft(){ return segs.length - shown; }
function paintStory(){
  var vis = [];
  for (var i = 0; i < shown; i++) vis = vis.concat(segs[i]);
  setCaption(vis, null, true);
  if (hiddenLeft() > 0) {
    var b = document.createElement("button"); b.type = "button"; b.className = "reveal"; b.textContent = "👀 Bé trả lời xong rồi, xem tiếp";
    b.onclick = revealMore; linesEl.appendChild(b);

  else nx.textContent = cur === PAGES.length - 1 ? "Đọc lại ↺" : "Lật trang ▶";

function revealMore(){
  if (hiddenLeft() <= 0) return;
  shown++; SND.ok(); paintStory();
  var seg = segs[shown - 1];

function endPage(){
  var P = [["🦁","Dũng cảm"],["⏳","Kiên nhẫn"],["🧗","Bền bỉ"],["💛","Yêu thương"],["🤲","Tử tế"],["🙂","Trung thực"]];
  pageEl.innerHTML = '<div class="game"><h2>'+AV.tkh+'Hôm nay bạn đã dùng sức mạnh bên trong nào?</h2>' +
    '<div class="stone-box" style="height:clamp(90px,20vw,220px);display:flex;justify-content:center"><svg viewBox="-260 -230 520 280" preserveAspectRatio="xMidYMid meet" style="height:100%;width:100%" id="stoneSvg">'+DEFS+rock(0,0,1.6,{veins:1, glow:0.4})+'</svg></div>' +
    '<div class="end-powers">' + P.map(function(p){ return '<button class="opt" type="button" data-n="'+p[1]+'"><span class="emo">'+p[0]+'</span>'+p[1]+'</button>'; }).join("") + '</div>' +
    '<div class="fb">Chạm vào sức mạnh bạn đã dùng. Chọn mấy cái cũng được!</div></div>';
  setCaption([["Bin", "Hôm nay bạn đã dùng sức mạnh bên trong nào? Chạm vào hình rồi kể cho ba mẹ nghe nhé!"]]);
  var picked = 0;
  pageEl.querySelectorAll(".end-powers .opt").forEach(function(b){ b.onclick = function(){
    if (b.classList.contains("ok")) return; b.classList.add("ok"); picked++;
    document.getElementById("stoneSvg").innerHTML = DEFS + rock(0,0,1.6,{veins: Math.min(2, 1 + picked), glow: 0.6 + picked*0.25});
    SND.win(); var fb = pageEl.querySelector(".fb"); fb.className = "fb";
    fb.textContent = "Viên đá của Bin vừa sáng thêm nhờ sức mạnh " + b.dataset.n.toLowerCase() + " của bạn! Kể cho ba mẹ nghe nhé.";
    speak(fb.textContent);
  }; });
}

/* ---------- lật trang ---------- */
function render(){
  var p = PAGES[cur];
  pageEl.classList.toggle("is-game", p.type === "game" || p.type === "end");
  if (p.type === "cover") cover();
  else if (p.type === "scene") { curKey = p.k; pageEl.innerHTML = scene(p.k); segs = splitSegs(TRUYEN[p.k] || S[p.k].lines); shown = 1; }
  else if (p.type === "game") {
    if (p.g === "who") gameWho(); else if (p.g === "order") gameOrder(); else if (p.g === "two") gameTwo();
    else if (p.g === "why") gameChoice("Trò 4 · Vì sao cây cầu xây xong?", "Vì sao cuối cùng cây cầu xây xong?",
      [["💪","Vì Voi Con mạnh nhất rừng",false],["🤝","Vì hai bạn bình tĩnh làm cùng nhau: Voi Con đặt đá, Sóc Nhỏ chèn sỏi",true],["🌧️","Vì trời đổ mưa",false]],
      "Đúng rồi! Cơ bắp thôi chưa đủ. Bình tĩnh, kiên nhẫn và mỗi bạn làm phần mình giỏi mới xây xong cầu.");
    else gameChoice("Trò 5 · Viên đá của Bin sáng lên khi nào?", "Viên đá của Bin sáng lên một vệt khi nào?",
      [["😤","Khi Bin bực mình bỏ đi",false],["🍪","Khi Bin bình tĩnh thử lại và mở được hũ bánh",true],["😴","Khi Bin đi ngủ",false]],
      "Đúng rồi! Mỗi lần Bin dùng sức mạnh bên trong, Ngôi Sao Sáng lại khỏe thêm một chút.");
  }
  else endPage();
  document.getElementById("num").textContent = "Trang " + (cur + 1) + " / " + PAGES.length;
  document.getElementById("bar").style.width = ((cur + 1) / PAGES.length * 100) + "%";
  document.getElementById("prev").disabled = cur === 0;
  var nx = document.getElementById("next");
  nx.textContent = cur === PAGES.length - 1 ? "Đọc lại ↺" : "Lật trang ▶";
  if (p.type === "scene") paintStory(); else curKey = null;
  try { localStorage.setItem("tt_tuan2_page", String(cur)); } catch(e){}
}
var busy = false;
function go(dir){
  if (busy) return;
  var target = dir > 0 ? (cur === PAGES.length - 1 ? 0 : cur + 1) : cur - 1;
  if (target < 0) return;
  busy = true; try { speechSynthesis.cancel(); } catch(e){}
  SND.flip();
  var reduce = false; try { reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}
  var outC = dir > 0 ? "out-next" : "out-prev", inC = dir > 0 ? "in-next" : "in-prev";
  function swap(){ pageEl.classList.remove(outC); cur = target; render(); pageEl.classList.add(inC); setTimeout(function(){ pageEl.classList.remove(inC); busy = false; }, reduce ? 0 : 330); }
  if (reduce) swap(); else { pageEl.classList.add(outC); setTimeout(swap, 320); }
}
document.getElementById("next").onclick = function(){ if (PAGES[cur].type === "scene" && hiddenLeft() > 0) revealMore(); else go(1); };
document.getElementById("prev").onclick = function(){ go(-1); };
document.getElementById("say").onclick = function(){ speak(speakText); };
document.addEventListener("keydown", function(e){ if (e.key === "ArrowRight") document.getElementById("next").onclick(); if (e.key === "ArrowLeft") go(-1); });
var sx = null;
pageEl.addEventListener("touchstart", function(e){ sx = e.touches[0].clientX; }, {passive: true});
pageEl.addEventListener("touchend", function(e){ if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; sx = null; if (Math.abs(dx) > 60 && !e.target.closest(".opt")) { if (dx < 0) document.getElementById("next").onclick(); else go(-1); } });
try { var saved = +localStorage.getItem("tt_tuan2_page"); if (saved > 0 && saved < PAGES.length) cur = saved; } catch(e){}
render();
})();
</script>
</body></html>
