<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Siêu Anh Hùng Đèn Giao Thông</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap">
<style>
  :root{--night:#1C2759;--night2:#111836;--gold:#FFC93C;--gold-d:#E08A00;--cream:#FFF8E8;--ink:#2E2618;--soft:#7A6648;--teal:#22B8A6;
        --green:#2DBE6C;--yellow:#FFC93C;--red:#F0475A;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{overflow-x:hidden;background:radial-gradient(70vmax 50vmax at 85% 5%,rgba(255,201,60,.18),transparent 70%),radial-gradient(60vmax 50vmax at 5% 100%,rgba(63,214,198,.14),transparent 70%),linear-gradient(180deg,var(--night),var(--night2));
       font-family:'Nunito',Arial,sans-serif;color:#FFF6E0;overflow:hidden;user-select:none;}
  #dots i{position:fixed;border-radius:50%;background:#FFF3C4;animation:tw 3s ease-in-out infinite;pointer-events:none;}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20;}
  .app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);max-width:1100px;margin:0 auto;gap:2vh;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;}
  .logos{display:flex;align-items:center;gap:10px;}
  .logos img{height:clamp(30px,min(7vh,11vw),64px);filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));}
  .logos .sep{width:2px;height:clamp(24px,min(5vh,8vw),48px);background:rgba(255,255,255,.22);}
  .stars{display:flex;gap:clamp(2px,1vw,8px);}
  .stars span{font-size:clamp(14px,min(4.5vh,5vw),42px);filter:grayscale(1) brightness(.45);transition:filter .3s,transform .3s;}
  .stars span.on{filter:none;animation:starpop .6s cubic-bezier(.2,1.6,.4,1);}
  @keyframes starpop{0%{transform:scale(2.2) rotate(-30deg)}100%{transform:none}}
  .btn-round{width:clamp(40px,min(8vh,11vw),64px);height:clamp(40px,min(8vh,11vw),64px);border-radius:50%;border:3px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:clamp(22px,4vh,32px);cursor:pointer;flex-shrink:0;}
  .btn-round:focus-visible,.light:focus-visible,.play:focus-visible{outline:4px solid var(--gold);outline-offset:4px;}

  .screen{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.4vh;min-height:0;}
  .screen.on{display:flex;}

  /* màn bắt đầu */
  .hero{font-size:clamp(80px,18vh,170px);line-height:1;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  h1{font-family:'Baloo 2',sans-serif;margin:0;color:var(--gold);text-align:center;line-height:1;font-size:clamp(28px,min(7vh,9vw),72px);text-shadow:0 0 30px rgba(255,201,60,.4);text-wrap:balance;}
  .mas{display:flex;gap:20px;}
  .mas img{width:clamp(70px,13vh,130px);height:clamp(70px,13vh,130px);border-radius:50%;object-fit:cover;border:6px solid var(--gold);background:#FFF6E0;animation:float 3s ease-in-out infinite;}
  .mas img.t{border-color:var(--teal);object-position:50% 12%;animation-delay:1.5s;}
  .play{width:clamp(130px,24vh,200px);height:clamp(130px,24vh,200px);border-radius:50%;border:0;background:var(--gold);color:var(--night2);font-size:clamp(60px,11vh,96px);cursor:pointer;box-shadow:0 0 0 14px rgba(255,201,60,.18),0 14px 40px rgba(0,0,0,.4);animation:pulse 1.6s ease-in-out infinite;padding-left:12px;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 10px rgba(255,201,60,.18),0 14px 40px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 28px rgba(255,201,60,.08),0 14px 40px rgba(0,0,0,.4)}}
  .small{font-size:clamp(15px,2.2vh,20px);font-weight:800;color:#C9CDF0;text-align:center;max-width:620px;}

  /* màn chơi */
  .scene{position:relative;width:100%;flex:1;min-height:0;background:var(--cream);border-radius:clamp(26px,5vh,48px);box-shadow:0 18px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;padding:2vh 16px;color:var(--night);overflow:hidden;}
  .scene.shake{animation:shake .45s;}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
  .pic{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,24px);line-height:1;}
  .pic span{font-size:clamp(44px,min(15vh,22vw),150px);animation:in .6s cubic-bezier(.2,1.6,.4,1) both;}
  .pic span:nth-child(2){animation-delay:.18s}.pic span:nth-child(3){animation-delay:.36s}
  @keyframes in{0%{opacity:0;transform:scale(.2) rotate(-12deg)}100%{opacity:1;transform:none}}
  .cap{font-size:clamp(17px,3vh,30px);font-weight:900;text-align:center;line-height:1.25;text-wrap:balance;max-width:820px;}
  .say{position:absolute;top:12px;right:12px;border-color:rgba(28,39,89,.2);background:#fff;color:var(--night);}
  .fb{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1vh;border-radius:inherit;text-align:center;padding:16px;}
  .fb.on{display:flex;animation:in .45s cubic-bezier(.2,1.5,.4,1) both;}
  .fb.g{background:#E3F8EC;} .fb.y{background:#FFF1CF;} .fb.r{background:#FFECEF;}
  .fb .big{font-size:clamp(70px,16vh,150px);line-height:1;}
  .fb b{font-family:'Baloo 2',sans-serif;font-size:clamp(30px,6vh,60px);line-height:1;}
  .fb.g b{color:#178A4A;} .fb.y b{color:#B36A00;} .fb.r b{color:#C0364C;}
  .fb p{margin:0;font-size:clamp(17px,3vh,30px);font-weight:900;max-width:760px;}
  .fb .star{position:absolute;top:12%;right:12%;font-size:clamp(40px,8vh,80px);animation:fly 1.3s ease-in both;}
  @keyframes fly{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:translate(30vw,-40vh) scale(.5)}}
  .lights{display:flex;justify-content:center;gap:clamp(10px,4vw,44px);width:100%;}
  .light{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0;font:inherit;color:#FFF6E0;}
  .light i{display:block;width:clamp(64px,min(15vh,24vw),150px);height:clamp(64px,min(15vh,24vw),150px);border-radius:50%;border:6px solid rgba(255,255,255,.85);box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .15s;}
  .light:active i{transform:scale(.92);}
  .light.g i{background:var(--green);} .light.y i{background:var(--yellow);} .light.r i{background:var(--red);}
  .light span{font-size:clamp(16px,2.6vh,24px);font-weight:900;}
  .light.hint i{animation:hint 1s ease-in-out infinite;}
  @keyframes hint{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}50%{box-shadow:0 0 0 22px rgba(255,255,255,0)}}
  .light.wob i{animation:shake .45s;}
  .lights.lock{pointer-events:none;}

  /* màn huy hiệu */
  .badge{position:relative;width:clamp(180px,min(40vh,62vw),360px);height:clamp(180px,min(40vh,62vw),360px);border-radius:50%;background:radial-gradient(circle at 50% 40%,#FFE89A,var(--gold) 60%,var(--gold-d));display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 70px rgba(255,201,60,.55),inset 0 0 0 12px rgba(255,255,255,.35);animation:in .8s cubic-bezier(.2,1.5,.4,1) both;}
  .badge .ring{position:absolute;inset:-20px;border-radius:50%;border:4px dashed rgba(255,201,60,.6);animation:spin 16s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .badge .h{font-size:clamp(80px,15vh,140px);line-height:1;}
  .badge .st{font-size:clamp(18px,3vh,28px);letter-spacing:2px;}
  .badge .nm{font-family:'Baloo 2',sans-serif;font-size:clamp(20px,3.6vh,34px);color:var(--night2);font-weight:800;max-width:80%;text-align:center;line-height:1.05;min-height:1em;}
  .promise{display:flex;gap:clamp(10px,3vw,30px);}
  .promise div{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:22px;padding:10px 14px;animation:in .6s cubic-bezier(.2,1.6,.4,1) both;}
  .promise div:nth-child(1){animation-delay:.6s}.promise div:nth-child(2){animation-delay:.9s}.promise div:nth-child(3){animation-delay:1.2s}
  .promise span{font-size:clamp(34px,6vh,56px);line-height:1;}
  .promise small{font-size:clamp(13px,2vh,18px);font-weight:900;color:#FFF6E0;}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .name{font:inherit;font-size:clamp(15px,2.2vh,19px);font-weight:800;padding:10px 16px;border-radius:999px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;width:min(260px,70vw);text-align:center;}
  .name::placeholder{color:#C9CDF0;}
  .again{font:inherit;font-size:clamp(17px,2.6vh,22px);font-weight:900;border:0;border-radius:999px;padding:12px 26px;background:var(--teal);color:#fff;cursor:pointer;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style></head>

<script>
(function(){
  /* ---------- âm thanh ---------- */
  var AC=null, muted=false;
  function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==="suspended") AC.resume(); return AC; }

  function loop(){ cx.clearRect(0,0,cv.width,cv.height); parts=parts.filter(function(p){ return p.y<cv.height+30; });
    parts.forEach(function(p){ p.vy+=.12; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); cx.restore(); });
    raf=parts.length?requestAnimationFrame(loop):null; }

  /* ---------- sao trang trí ---------- */
  var dots=document.getElementById("dots"); for(var i=0;i<50;i++){ var d=document.createElement("i"), z=1+Math.random()*3; d.style.cssText="width:"+z+"px;height:"+z+"px;left:"+(Math.random()*100)+"vw;top:"+(Math.random()*100)+"vh;animation-delay:"+(Math.random()*3)+"s"; dots.appendChild(d); }

  /* ---------- 6 tình huống ---------- */
  var Q=[
    {pic:["👨‍👩‍👧","📺","🐼"], cap:"Con cùng ba mẹ xem video về động vật.", k:"g", fb:"Có ba mẹ cùng xem, vui quá!"},
    {pic:["👤","📸","❓"], cap:"Người lạ trên mạng xin ảnh của con.", k:"r", fb:"Ảnh của con là của con. Kể ba mẹ nhé."},
    {pic:["🎮","⬇️"], cap:"Con muốn tải một trò chơi mới.", k:"y", fb:"Dừng lại, hỏi ba mẹ trước."},
    {pic:["👤","💬","🤝"], cap:"Người lạ nhắn tin muốn kết bạn với con.", k:"y", fb:"Không tự trả lời, hỏi người lớn."},
    {pic:["🤫","👨‍👩‍👧"], cap:"Có người bảo: “Đừng kể với ba mẹ nhé!”", k:"r", fb:"Luôn kể với ba mẹ!"},
    {pic:["📱","😱"], cap:"Hình ảnh đáng sợ hiện lên màn hình.", k:"r", fb:"Úp màn hình, kể ba mẹ. Con không có lỗi."}
  ];
  var NAME={g:["🟢","Đèn xanh!"], y:["🟡","Đèn vàng!"], r:["🔴","Đèn đỏ!"]};
  var cur=0, tries=0, busy=false;
  var $=function(id){ return document.getElementById(id); };
  pickVoice();
  var stars=$("stars"); Q.forEach(function(){ var s=document.createElement("span"); s.textContent="⭐"; stars.appendChild(s); });

  function show(id){ ["start","game","done"].forEach(function(s){ $(s).classList.toggle("on", s===id); }); }
  function round(){
    var q=Q[cur]; tries=0; busy=false;
    $("fb").className="fb"; $("lights").classList.remove("lock");
    document.querySelectorAll(".light").forEach(function(b){ b.classList.remove("hint","wob"); });
    var pic=$("pic"); pic.innerHTML=""; q.pic.forEach(function(e){ var s=document.createElement("span"); s.textContent=e; pic.appendChild(s); });
    $("cap").textContent=q.cap; SFX.whoosh(); setTimeout(function(){ SFX.pop(); speak(q.cap); },250);
  }
  function choose(k, btn){
    if(busy) return; ac(); var q=Q[cur];
    if(k===q.k){
      busy=true; $("lights").classList.add("lock");
      var n=NAME[k], fb=$("fb"); fb.className="fb on "+k;
      fb.innerHTML='<div class="big">'+n[0]+'</div><b>'+n[1]+'</b><p>'+q.fb+'</p><div class="star">⭐</div>';
      SFX.right(); speak(n[1]+" "+q.fb); confetti(60);
      setTimeout(function(){ stars.children[cur].classList.add("on"); },700);
      setTimeout(function(){ cur++; if(cur<Q.length) round(); else finish(); }, 2600);
    } else {
      tries++; SFX.hmm(); speak("Mình thử lại nhé!");
      $("scene").classList.remove("shake"); void $("scene").offsetWidth; $("scene").classList.add("shake");
      btn.classList.remove("wob"); void btn.offsetWidth; btn.classList.add("wob");
      if(tries>=2) document.querySelector('.light[data-k="'+q.k+'"]').classList.add("hint");
    }
  }
  function finish(){
    show("done"); SFX.win(); confetti(220); setTimeout(function(){ confetti(160); },1000);
    speak("Chúc mừng con! Con đã là siêu anh hùng an toàn số. Thông tin của mình, mình giữ. Chưa chắc, mình hỏi. Thấy sợ, mình kể.");
  }
  function start(){ ac(); cur=0; Array.prototype.forEach.call(stars.children,function(s){ s.classList.remove("on"); }); show("game"); round(); }

  $("play").addEventListener("click", start);
  $("again").addEventListener("click", start);
  $("say").addEventListener("click", function(){ speak(Q[cur].cap); SFX.pop(); });
  document.querySelectorAll(".light").forEach(function(b){ b.addEventListener("click", function(){ choose(b.dataset.k, b); }); });
  $("mute").addEventListener("click", function(){ muted=!muted; this.textContent=muted?"🔇":"🔊"; if(muted){ try{ speechSynthesis.cancel(); }catch(e){} } });
  $("name").addEventListener("input", function(){ $("nm").textContent=this.value; });
  // phím tắt cho cô khi chia sẻ màn hình: 1 xanh · 2 vàng · 3 đỏ · Enter bắt đầu
  document.addEventListener("keydown", function(e){
    if(e.target.tagName==="INPUT") return;
    if($("start").classList.contains("on") && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); start(); return; }
    var m={"1":"g","2":"y","3":"r"}[e.key]; if(m && $("game").classList.contains("on")) choose(m, document.querySelector('.light[data-k="'+m+'"]'));
  });
})();
</script>
</body></html>
